    <style>
        /* --- ARQUITECTURA DE COLOR DINÁMICA --- */
        :root {
            --color-primary-dark: #0B1120;
            --color-surface: #1E293B;
            --color-red: #EF4444;
            
            /* Colores de Tema (Valores por defecto NEÓN AZUL) */
            --theme-accent: #00DDEE; /* Azul Neón */
            --theme-primary: #0F5DAA; /* Azul Intenso */
            --theme-surface-glow: rgba(0, 221, 238, 0.4);
        }
        
        .theme-gold {
            --theme-accent: #FFCC00; /* Hyper Dorado */
            --theme-primary: #D97706; /* Naranja/Oro */
            --theme-surface-glow: rgba(255, 204, 0, 0.4);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--color-primary-dark);
            color: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow: hidden; 
        }

        .main-container {
            width: 100%;
            height: 100vh;
            max-width: 450px;
            background: linear-gradient(180deg, var(--color-primary-dark) 0%, #0F172A 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(37, 99, 235, 0.15);
        }

        /* --- Tipografía --- */
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -0.02em; }
        .font-body { font-family: 'Lato', sans-serif; }

        #view-container {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 80px;
            scroll-behavior: smooth;
        }
        #view-container::-webkit-scrollbar { width: 0px; background: transparent; }

        /* --- Componentes de Material y Colores de Tema --- */
        .card-material {
            background-color: var(--color-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .card-material:active { transform: scale(0.98); }
        
        .text-accent { color: var(--theme-accent); }
        .bg-accent { background-color: var(--theme-accent); }
        .border-accent { border-color: var(--theme-accent); }

        /* --- Barra Superior (Nueva Interfaz) --- */
        #top-header {
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
        }
        .header-icon { color: var(--theme-accent); }

        /* --- Barra Inferior (Nueva Interfaz) --- */
        #bottom-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 50;
        }
        .nav-item { color: #94A3B8; transition: all 0.3s; }
        .nav-item.active { color: var(--theme-accent); transform: translateY(-2px); }
        .nav-main-icon { color: var(--color-primary-dark); }
        .nav-main-wrapper { background: linear-gradient(45deg, var(--theme-accent), var(--theme-primary)); }

        #splash-screen { background: #0B1120; z-index: 100; }
        
        /* --- CHAT Y CEREBRO 3D --- */
        .chat-message-bubble.sinapptron { background: #1E293B; border-left: 3px solid var(--theme-accent); color: #E2E8F0; }
        .chat-message-bubble.user { background: linear-gradient(135deg, var(--theme-primary), #1D4ED8); color: white; border-bottom-right-radius: 4px; }
        
        #brain-3d-container {
            width: 100%; height: 200px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(11, 17, 32, 0) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brain-glow {
            fill: var(--theme-accent);
            filter: drop-shadow(0 0 15px var(--theme-accent));
            opacity: 0.9;
            transition: all 0.5s ease-out;
        }
        .brain-core {
            fill: var(--theme-primary);
            opacity: 0.5;
        }
        .brain-active .brain-glow {
            filter: drop-shadow(0 0 30px var(--theme-accent)) drop-shadow(0 0 15px var(--theme-accent));
            animation: pulse-brain 1.5s infinite alternate;
        }

        @keyframes pulse-brain {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--theme-accent), var(--theme-primary));
            color: var(--color-primary-dark);
            font-weight: 800;
            box-shadow: 0 4px 15px var(--theme-surface-glow);
            transition: all 0.2s;
        }
        .btn-primary:active { transform: scale(0.95); }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--theme-accent);
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #api-modal { backdrop-filter: blur(8px); z-index: 200; }
        #jitsi-container { width: 100%; height: 100%; background: black; }
        
        .chat-audio-controls {
            display: flex;
            align-items: center;
            margin-top: 8px;
            gap: 8px;
        }
        .chat-audio-controls button {
            width: 30px; height: 30px;
            border-radius: 50%;
            background-color: var(--theme-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .chat-audio-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .audio-loading-spinner {
             border: 2px solid rgba(255, 255, 255, 0.2);
             border-left-color: var(--theme-accent);
             border-radius: 50%; width: 18px; height: 18px;
             animation: spin 1s linear infinite;
        }
    </style>
</head>
