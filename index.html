<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>§inapptron v40 - Neural OS</title>
    
    <!-- DEPENDENCIAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FUENTES TECH & MODERN -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Fira+Code:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <script src='https://meet.jit.si/external_api.js'></script>
    <!-- PRISM CODE HIGHLIGHTING -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    
    <!-- MOTOR 3D -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <style>
        /* --- VARIABLES & CONSTANTES VISUALES --- */
        :root {
            --bg-deep: #030305;
        }

        /* TEMA ORO (DUNE TECH) */
        body.theme-gold { 
            --primary: #FFD700; /* Oro Puro */
            --secondary: #FF6B00; /* Naranja Plasma */
            --bg-gradient: linear-gradient(180deg, #120f00 0%, #000000 100%);
            --glass-bg: rgba(20, 15, 5, 0.6);
            --glass-border: rgba(255, 215, 0, 0.5);
            --glow: 0 0 20px rgba(255, 180, 0, 0.5);
            --hud-line: rgba(255, 215, 0, 0.15);
            --avatar-color: 0xFFD700;
        }
        
        /* TEMA AZUL (TRON LEGACY) */
        body.theme-blue { 
            --primary: #00F3FF; /* Cian Neón */
            --secondary: #0066FF; /* Azul Láser */
            --bg-gradient: linear-gradient(180deg, #000814 0%, #000000 100%);
            --glass-bg: rgba(0, 10, 20, 0.6);
            --glass-border: rgba(0, 243, 255, 0.5);
            --glow: 0 0 20px rgba(0, 243, 255, 0.5);
            --hud-line: rgba(0, 243, 255, 0.15);
            --avatar-color: 0x00F3FF;
        }

        /* TIPOGRAFÍA CAMBIANTE */
        body.font-modern { --font-display: 'Montserrat', sans-serif; --font-body: 'Rajdhani', sans-serif; }
        body.font-classic { --font-display: 'Playfair Display', serif; --font-body: 'Montserrat', sans-serif; }
        body.font-tech { --font-display: 'Orbitron', sans-serif; --font-body: 'Fira Code', monospace; }

        /* --- RESET & BASICS --- */
        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: white;
            height: 100dvh; width: 100vw;
            overflow: hidden;
            margin: 0; padding: 0;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* --- FONDO ANIMADO (GRID SCIFI) --- */
        .scifi-grid-bg {
            position: absolute; inset: 0; z-index: 0;
            background-image: 
                linear-gradient(var(--hud-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--hud-line) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 1000px;
            transform-style: preserve-3d;
            opacity: 0.3;
            mask-image: radial-gradient(circle, black 40%, transparent 90%);
            transition: opacity 0.5s ease;
        }

        /* --- BENTO GRID LAYOUT --- */
        .bento-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
            padding-bottom: 120px; /* Espacio para Nav */
        }
        
        .bento-cell {
            background: var(--glass-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.5s;
            box-shadow: var(--glow);
        }
        .bento-cell:active { transform: scale(0.98); }
        
        .cell-profile { grid-column: span 1; height: 160px; display: flex; flex-direction: column; justify-content: space-between; }
        .cell-status { grid-column: span 1; height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .cell-hero { grid-column: span 2; height: 180px; display: flex; align-items: center; justify-content: space-between; position: relative; }
        .cell-wide { grid-column: span 2; height: 80px; display: flex; align-items: center; gap: 15px; }
        .cell-tall { grid-column: span 1; height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }

        /* --- TIPOGRAFÍA --- */
        h1, h2, h3, h4 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 1px; }
        .glow-text { text-shadow: 0 0 10px var(--primary); }

        /* --- NAV FLOTANTE (CAPSULE) --- */
        #floating-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 50px;
            display: flex; justify-content: space-evenly; align-items: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--glass-border);
            transition: border-color 0.5s;
        }
        .nav-btn {
            color: #666; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-btn.active { color: var(--primary); transform: translateY(-15px) scale(1.2); text-shadow: 0 0 10px var(--primary); }
        .nav-btn i { font-size: 24px; margin-bottom: 2px; }
        .nav-btn .dot { width: 4px; height: 4px; background: var(--primary); border-radius: 50%; opacity: 0; transition: 0.3s; }
        .nav-btn.active .dot { opacity: 1; }

        /* --- CHAT 3D INTEGRADO --- */
        #activity-view { position: relative; height: 100%; display: flex; flex-col; background: black; }
        #chat-3d-layer { position: absolute; inset: 0; z-index: 0; opacity: 0.8; mask-image: linear-gradient(to bottom, black 50%, transparent 100%); }
        #chat-ui-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }
        
        .msg-bubble {
            background: rgba(0,0,0,0.7); border-left: 3px solid var(--primary);
            padding: 12px; margin: 8px 0; border-radius: 0 12px 12px 0;
            font-family: var(--font-body); font-weight: 600; font-size: 16px;
            backdrop-filter: blur(5px); max-width: 85%;
            animation: slideIn 0.3s ease-out;
        }
        .msg-user { align-self: flex-end; border-left: none; border-right: 3px solid var(--secondary); text-align: right; border-radius: 12px 0 0 12px; background: rgba(255,255,255,0.05); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        /* --- BUTTONS & INPUTS --- */
        .btn-glitch {
            background: var(--primary); color: black; font-weight: 900; font-family: var(--font-display);
            border: none; padding: 12px; width: 100%; border-radius: 8px;
            position: relative; overflow: hidden; transition: 0.3s; text-transform: uppercase;
        }
        .btn-glitch:hover { box-shadow: 0 0 30px var(--primary); letter-spacing: 2px; }
        
        .mic-btn {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; items-center; justify-center;
            transition: all 0.3s;
            border: 1px solid var(--primary);
            color: var(--primary);
            background: rgba(0,0,0,0.5);
        }
        .mic-btn.listening {
            background: var(--secondary); color: white;
            animation: pulseMic 1s infinite;
            box-shadow: 0 0 15px var(--secondary);
        }
        @keyframes pulseMic { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* AVATAR SINAPPTRON */
        .avatar-orb {
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--primary) 10%, transparent 70%);
            border-radius: 50%; border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--primary), inset 0 0 20px var(--primary);
            position: relative; transition: border-color 0.5s;
        }
        .orb-ring {
            position: absolute; inset: -10px; border: 1px dashed var(--secondary); border-radius: 50%;
            animation: spin 10s linear infinite; transition: border-color 0.5s;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* --- PANTALLAS DE CARGA & AUTH --- */
        #splash-screen, #auth-view { z-index: 9999; background: black; }
    </style>
</head>
<body class="theme-gold font-modern">

    <!-- BACKGROUND GRID ANIMATION -->
    <div class="scifi-grid-bg"></div>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 flex flex-col items-center justify-center transition-opacity duration-1000">
        <div class="avatar-orb mb-6 animate-pulse" style="width:80px; height:80px;">
            <div class="orb-ring"></div>
            <i class="ph-brain-fill text-4xl text-black z-10 relative"></i>
        </div>
        <h1 class="text-4xl font-bold tracking-widest text-white glow-text">SINAPPTRON</h1>
        <div class="w-48 h-1 bg-gray-800 mt-4 rounded overflow-hidden">
            <div class="h-full bg-white w-full animate-[loading_2s_ease-in-out_infinite]"></div>
        </div>
        <p class="text-xs text-gray-500 mt-2 font-mono">INIT_SEQUENCE_V40.1</p>
    </div>

    <!-- 2. AUTH VIEW -->
    <div id="auth-view" class="fixed inset-0 flex flex-col items-center justify-center p-8 hidden opacity-0 transition-opacity duration-500">
        <h1 class="text-6xl mb-2" style="color: var(--primary);">N.O.S.</h1>
        <p class="text-gray-400 tracking-[0.5em] text-xs mb-12">NEURAL OPERATING SYSTEM</p>
        
        <div class="w-full max-w-xs bg-white/5 border border-white/10 p-6 rounded-2xl backdrop-blur-xl">
            <button onclick="window.signInSystem()" class="btn-glitch mb-4">INICIAR ENLACE</button>
            <button class="w-full py-3 text-xs text-gray-400 hover:text-white border border-transparent hover:border-white/20 rounded-lg transition">CREAR ID NEURONAL</button>
        </div>
    </div>

    <!-- 3. MAIN APP CONTAINER -->
    <div id="app-container" class="relative z-10 hidden opacity-0 transition-opacity duration-500 h-full">
        
        <!-- VIEWPORT -->
        <div id="view-viewport" class="h-full overflow-y-auto no-scrollbar">

            <!-- A. DASHBOARD -->
            <div id="dashboard-view" class="bento-container">
                
                <!-- Profile Cell -->
                <div class="bento-cell cell-profile cursor-pointer" onclick="window.changeView('profile')">
                    <div class="flex justify-between items-start">
                        <div class="text-[10px] text-gray-400 font-mono">ID: 8492-X</div>
                        <i class="ph-gear-fill text-gray-500"></i>
                    </div>
                    <div>
                        <div class="text-3xl font-bold glow-text leading-none mb-1">RICHARD</div>
                        <div class="text-xl font-light opacity-80">FELIPE</div>
                    </div>
                    <div class="w-12 h-12 rounded-full border border-white/30 flex items-center justify-center text-2xl bg-white/5" id="avatar-display-dash">👨‍💻</div>
                </div>

                <!-- Status Cell -->
                <div class="bento-cell cell-status cursor-pointer" onclick="window.changeView('progress')">
                    <div class="w-20 h-20 relative flex items-center justify-center">
                        <svg class="absolute inset-0 w-full h-full rotate-[-90deg]" viewBox="0 0 36 36">
                            <path class="text-gray-800" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path class="text-[var(--primary)]" stroke-dasharray="75, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
                        </svg>
                        <div class="flex flex-col items-center">
                            <span class="text-2xl font-bold" id="xp-display">850</span>
                            <span class="text-[8px] text-gray-400">XP</span>
                        </div>
                    </div>
                    <div class="mt-2 text-[10px] tracking-widest text-[var(--secondary)] animate-pulse">ONLINE</div>
                </div>

                <!-- HERO: CHAT 3D PORTAL -->
                <div class="bento-cell cell-hero cursor-pointer group" onclick="window.changeView('activity')">
                    <div class="absolute inset-0 bg-gradient-to-r from-black to-transparent z-0"></div>
                    <div class="absolute right-[-20px] top-[-20px] opacity-20 group-hover:opacity-40 transition duration-500">
                        <i class="ph-chat-teardrop-text-fill text-9xl text-[var(--primary)]"></i>
                    </div>
                    <div class="relative z-10 p-2">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-2 h-2 bg-[var(--primary)] rounded-full animate-ping"></div>
                            <span class="text-[10px] text-[var(--primary)] font-mono">ENLACE ACTIVO</span>
                        </div>
                        <h2 class="text-3xl text-white mb-1 group-hover:translate-x-2 transition">CHAT<br>NEURAL 3D</h2>
                        <p class="text-xs text-gray-400 w-2/3">Interfaz inmersiva con entrada de voz.</p>
                    </div>
                    <div class="relative z-10 w-12 h-12 rounded-full border border-[var(--primary)] flex items-center justify-center bg-black/50 group-hover:scale-110 transition">
                        <i class="ph-microphone-fill text-[var(--primary)]"></i>
                    </div>
                </div>

                <!-- WIDE: VIDEO LINK -->
                <div class="bento-cell cell-wide cursor-pointer" onclick="window.openVideoSelection()">
                    <div class="w-10 h-10 bg-red-900/30 rounded flex items-center justify-center text-red-500 border border-red-500/50">
                        <i class="ph-video-camera-fill text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold">VIDEO SECURE</h3>
                        <p class="text-[10px] text-gray-400">Canal Encriptado Familia/IA</p>
                    </div>
                </div>

                <!-- TALL CELLS -->
                <div class="bento-cell cell-tall cursor-pointer" onclick="window.changeView('codex')">
                    <i class="ph-code-block text-3xl text-green-400 mb-2"></i>
                    <h3 class="text-xs">CODEX</h3>
                </div>
                <div class="bento-cell cell-tall cursor-pointer" onclick="window.changeView('exercises')">
                    <i class="ph-barbell text-3xl text-blue-400 mb-2"></i>
                    <h3 class="text-xs">GYM</h3>
                </div>
            </div>

            <!-- B. CHAT 3D VIEW -->
            <div id="activity-view" class="hidden h-full relative bg-black">
                <!-- 3D CANVAS BACKGROUND -->
                <div id="chat-3d-layer"><canvas id="chat-canvas" class="w-full h-full"></canvas></div>
                
                <!-- UI OVERLAY -->
                <div id="chat-ui-layer" class="p-4 pb-32">
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="window.changeView('dashboard')" class="w-10 h-10 rounded-full border border-white/20 bg-black/50 text-white backdrop-blur flex items-center justify-center hover:bg-white/10"><i class="ph-arrow-left"></i></button>
                        <div class="text-[10px] text-[var(--primary)] tracking-[0.3em] font-mono">SISTEMA_V40</div>
                        <div class="w-10"></div>
                    </div>
                    
                    <div id="chat-window" class="flex-grow overflow-y-auto no-scrollbar space-y-4 p-2">
                        <!-- Mensajes inyectados por JS -->
                    </div>

                    <!-- INPUT AREA (VOICE + PLAY/STOP) -->
                    <div class="mt-4 bg-black/80 border border-[var(--glass-border)] rounded-2xl p-2 flex items-center gap-2 backdrop-blur-xl shadow-2xl">
                        <!-- PLAY/STOP TTS -->
                        <button onclick="window.toggleVoice(true)" class="w-10 h-10 rounded-xl bg-green-900/20 text-green-400 border border-green-500/30 flex items-center justify-center"><i class="ph-play-fill"></i></button>
                        <button onclick="window.toggleVoice(false)" class="w-10 h-10 rounded-xl bg-red-900/20 text-red-400 border border-red-500/30 flex items-center justify-center"><i class="ph-stop-fill"></i></button>
                        
                        <!-- TEXT INPUT -->
                        <input type="text" id="chat-input" placeholder="Comando..." class="bg-transparent flex-grow text-sm text-white outline-none font-mono px-2">
                        
                        <!-- MICROPHONE BTN (NUEVO) -->
                        <button id="mic-btn" onclick="window.startDictation()" class="mic-btn flex items-center justify-center rounded-xl hover:bg-[var(--secondary)] hover:text-white border border-[var(--primary)]">
                            <i class="ph-microphone-fill text-xl"></i>
                        </button>
                        
                        <!-- SEND BTN -->
                        <button onclick="window.sendChat()" class="w-10 h-10 rounded-xl bg-[var(--primary)] text-black font-bold flex items-center justify-center hover:scale-105 transition"><i class="ph-paper-plane-right-fill"></i></button>
                    </div>
                </div>
            </div>

            <!-- C. GYM / EXERCISES VIEW -->

                <header class="flex items-center gap-4 mb-8"><button onclick="window.changeView('dashboard')" class="text-gray-400"><i class="ph-arrow-left text-2xl"></i></button><h2 class="text-3xl glow-text">ENTRENAMIENTO</h2></header>
                <div class="grid gap-4">
                    <div onclick="window.changeView('feynman')" class="bento-cell cursor-pointer hover:border-[var(--primary)] flex gap-4 items-center"><div class="p-3 bg-blue-500/20 rounded-lg text-blue-400"><i class="ph-brain text-2xl"></i></div><d
